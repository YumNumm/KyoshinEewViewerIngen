name: build-android

# Android 版 (src/KyoshinEewViewer.Android) の AAB / APK を artifact として出すワークフロー。
#
# ストア配信の deploy-app.yaml とは分けている。あちらは正式な署名鍵と
# App Store Connect 由来のビルド番号の管理が役割で、そのために
# environment (testflight-build / testflight) による Secrets の限定、
# 承認ゲート、ビルド番号の取り合いを防ぐ直列化まで組んである。
# ここで出すのは動作確認用の debug 署名済みパッケージで、
# 鍵もビルド番号も要らないため、それらの仕組みに乗せる必要が無い。
# Google Play への配信を始める段階で deploy-app.yaml 側へ改めて組み込む。

on:
  push:
    branches:
      - develop
    paths:
      - "src/**"
      - "common.props"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/build-android.yaml"
  pull_request:
    paths:
      - "src/KyoshinEewViewer.Android/**"
      - ".github/workflows/build-android.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

env:
  # mise が asdf の dotnet プラグインを入れる際に同意を求めて失敗するため非対話で許可する
  MISE_YES: "1"

jobs:
  build:
    name: AAB / APK ビルド
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # CSV ソースジェネレータが jma-code-dictionary/csv に依存する
          submodules: recursive
          persist-credentials: false

      # .NET Android の SDK は JDK 21 以外を XA0030 で弾く。
      # ランナー既定の JAVA_HOME は 17 を指しているため明示的に切り替える
      - name: Setup JDK 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "21"

      # .NET SDK は mise.toml / mise.lock 側で管理しているため setup-dotnet は使わない。
      # mise 本体だけ入れ、ツールの導入は次のステップで行う。
      # mise.lock が dotnet を asdf バックエンドで固定しており、プラグイン未導入の
      # 環境では同意を求めて失敗する。mise-action は --yes を渡さないため自分で渡す
      # (プラグイン名 dotnet は core プラグインと衝突するので明示的な導入はできない)
      - name: Setup mise (.NET SDK)
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tools via mise
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mise install --yes
          mise ls --current

      # android ワークロードが無いと net10.0-android をビルドできない。
      # mise の dotnet はユーザー領域に入るため sudo は不要
      - name: Restore workload
        shell: bash
        run: dotnet workload restore src/KyoshinEewViewer.Android/KyoshinEewViewer.Android.csproj

      # Release では SDK の既定 (AndroidPackageFormats=aab;apk) で AAB と APK の両方が出る。
      # 署名鍵を渡していないため、どちらも SDK が自動生成する debug キーで署名される
      - name: AAB / APK を作成
        shell: bash
        run: dotnet publish src/KyoshinEewViewer.Android/KyoshinEewViewer.Android.csproj -c Release -o out/android

      - name: AAB を artifact へアップロード
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-aab
          path: out/android/*.aab
          if-no-files-found: error
          retention-days: 7

      - name: APK を artifact へアップロード
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-apk
          path: out/android/*.apk
          if-no-files-found: error
          retention-days: 7
