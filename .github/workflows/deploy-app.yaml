name: CD

# 必要な Secrets / Variables:
#   ASC_APP_ID                      Variables 推奨。ASC のアプリ ID (数値)。
#                                   net.yumnumm.KyoshinEewViewer のアプリレコードを作成してから設定する
#   ASC_KEY_ID                      ASC API キー ID
#   ASC_ISSUER_ID                   ASC の issuer ID (UUID)。asc auth issuer-id で取得
#   ASC_PRIVATE_KEY_B64             AuthKey_<KEY_ID>.p8 を base64 化したもの
#   TESTFLIGHT_EXTERNAL_GROUP       Variables 推奨。iOS の配布先ベータグループ ID または名前。
#                                   未設定なら "External Test" グループの ID を既定値として使う
#   MAC_APP_DIST_P12_BASE64         (macOS のみ) .app 署名証明書の .p12
#   MAC_INSTALLER_DIST_P12_BASE64   (macOS のみ) pkg 署名証明書の .p12
#   MAC_P12_PASSWORD                (macOS のみ) 上記 .p12 のパスワード
#   MAC_PROVISIONING_PROFILE_BASE64 (macOS のみ) Mac App Store 用プロビジョニングプロファイル
#   EQMONITOR_BASE_URL              配布ビルドに埋め込む EQMonitor API の既定の接続先。
#                                   ソースに接続先を持たせないため Secret から環境変数で渡す。
#                                   未設定でもビルドは成功し、既定の接続先が埋め込まれないだけ
on:
    push:
        branches:
            - develop
        tags:
            - "*.*.*"
    workflow_dispatch:
        inputs:
            platform:
                description: "実行対象"
                type: choice
                options:
                    - all
                    - containers
                    - desktop
                    - android
                    - store
                    - ios
                    - macos
                default: all
            tag:
                description: "Container Image Tag"
                required: false
                default: "latest"
            app_version:
                description: "App Version (CFBundleShortVersionString)"
                type: string
                default: "1.0"
            build_number:
                description: "Build Number (CFBundleVersion)"
                type: string
                default: ""
            testflight_group:
                description:
                    "iOS の配布先 TestFlight テスターグループ ID / 名前。空なら
                    TESTFLIGHT_EXTERNAL_GROUP (既定の外部テスターグループ) へ配布する"
                type: string
                default: ""
            skip_upload:
                description: "ビルドのみ行い App Store Connect へアップロードしない"
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    # ビルド番号を App Store Connect から取る job がある以上、並走すると同じ番号を取り合うため直列化する。
    # 配信途中のアップロードを切らないよう cancel-in-progress は false 固定
    # (統合前の build-android は true だったので、Android のビルドも中断されなくなった)
    group: deploy-app-${{ github.ref }}
    cancel-in-progress: false

env:
    REGISTRY: ghcr.io
    XCODE_VERSION: "26.6"
    MISE_YES: "1"
    ASC_BYPASS_KEYCHAIN: "1"
    ASC_SPINNER_DISABLED: "1"
    TESTFLIGHT_LOCALE: "ja"

jobs:
    containers:
        name: ${{ matrix.name }} Docker Image
        if: >-
            github.event_name == 'push'
            || (github.event_name == 'workflow_dispatch'
            && (inputs.platform == 'all' || inputs.platform == 'containers'))
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: ShakeDetectionProducer
                      image: shake-detection-producer
                      dockerfile: src/Sandboxes/ShakeDetectionProducer/Dockerfile
                    - name: ReplayGenerator
                      image: replay-generator
                      dockerfile: src/Sandboxes/ReplayGenerator/Dockerfile
        steps:
            # https://github.com/actions/checkout
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  submodules: recursive
                  persist-credentials: false

            # https://github.com/docker/setup-qemu-action
            - name: Set up QEMU
              uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

            # https://github.com/docker/setup-buildx-action
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

            # https://github.com/docker/login-action
            - name: Log in to Container Registry
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # https://github.com/docker/metadata-action
            - name: Extract metadata (tags, labels) for Docker
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
                  tags: |
                      type=raw,value=${{ inputs.tag || 'latest' }}
                      type=sha,prefix=
                      type=ref,event=branch

            # https://github.com/docker/build-push-action
            - name: Build and push Docker image
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: .
                  file: ${{ matrix.dockerfile }}
                  push: true
                  platforms: linux/amd64,linux/arm64
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=${{ matrix.image }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.image }}

    desktop:
        name: Build Desktop (${{ matrix.os }} ${{ matrix.arch }})
        if: >-
            github.event_name == 'push'
            || (github.event_name == 'workflow_dispatch'
            && (inputs.platform == 'all' || inputs.platform == 'desktop'))
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    # arm64 は self-contained publish のクロスコンパイルで賄えるため、
                    # arm64 ランナーは使わず x64 ランナーで両アーキテクチャをビルドする
                    - os: windows
                      arch: x64
                      runner: windows-2025
                    - os: windows
                      arch: arm64
                      runner: windows-2025
                    - os: ubuntu
                      arch: x64
                      runner: ubuntu-24.04
                    - os: ubuntu
                      arch: arm64
                      runner: ubuntu-24.04
                    - os: macos
                      arch: arm64
                      runner: macos-26
        env:
            RELEASE_PREFIX: KyoshinEewViewer
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  submodules: recursive
                  persist-credentials: false

            - uses: FranzDiebold/github-env-vars-action@e8118971bd6b60524ae66a2d870bc83088e3a3c9 # v2.9.0

            - name: Setup .NET
              uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
              with:
                  dotnet-version: 10.0.x

            - name: Parse version from tag
              id: version
              env:
                  GITHUB_REF_NAME_RAW: ${{ github.ref }}
              run: |
                  if [[ "$GITHUB_REF_NAME_RAW" =~ refs/tags/(.*) ]]; then
                    TAG_NAME="${BASH_REMATCH[1]}"

                    if [[ "$TAG_NAME" == *"-"* ]]; then
                      APP_VERSION=$(echo "$TAG_NAME" | cut -d'-' -f1)
                      VERSION_SUFFIX=$(echo "$TAG_NAME" | cut -d'-' -f2-)
                    else
                      APP_VERSION="$TAG_NAME"
                      VERSION_SUFFIX=""
                    fi

                    echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_OUTPUT"
                    echo "VERSION_SUFFIX=$VERSION_SUFFIX" >> "$GITHUB_OUTPUT"
                    echo "Parsed version: $APP_VERSION, suffix: $VERSION_SUFFIX"
                  else
                    echo "APP_VERSION=0.1.1" >> "$GITHUB_OUTPUT"
                    echo "VERSION_SUFFIX=" >> "$GITHUB_OUTPUT"
                  fi
              shell: bash

            - name: Build
              uses: ./.github/actions/publish-kevi
              with:
                  os: ${{ matrix.os }}
                  arch: ${{ matrix.arch }}
                  app-version: ${{ steps.version.outputs.APP_VERSION }}
                  version-suffix: ${{ steps.version.outputs.VERSION_SUFFIX }}
                  build-number: ${{ env.GITHUB_RUN_NUMBER }}
                  eqmonitor-base-url: ${{ secrets.EQMONITOR_BASE_URL }}
                  output-dir: out

            - name: Upload artifacts
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: ${{ env.RELEASE_PREFIX }}-${{ matrix.os }}-${{ matrix.arch }}
                  path: out/dist/*

            - name: Archive
              uses: TheDoctor0/zip-release@b57d897cb5d60cb78b51a507f63fa184cfe35554 # 0.7.6
              if: startsWith(github.ref, 'refs/tags/')
              with:
                  type: "zip"
                  directory: out/dist
                  path: "*"
                  filename: ../../${{ env.RELEASE_PREFIX }}-${{ matrix.os }}-${{ matrix.arch }}.zip

            - name: Upload release assets
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: startsWith(github.ref, 'refs/tags/')
              with:
                  name: release-${{ matrix.os }}-${{ matrix.arch }}
                  path: ${{ env.RELEASE_PREFIX }}-${{ matrix.os }}-${{ matrix.arch }}.zip

    create-release:
        name: Create GitHub Release
        needs:
            - desktop
        runs-on: ubuntu-24.04-arm
        if: startsWith(github.ref, 'refs/tags/')
        permissions:
            contents: write
        steps:
            - uses: FranzDiebold/github-env-vars-action@e8118971bd6b60524ae66a2d870bc83088e3a3c9 # v2.9.0

            - name: Download all release assets
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  pattern: release-*
                  path: release-assets
                  merge-multiple: true

            - name: Create Release
              uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
              with:
                  files: release-assets/*
                  name: KyoshinEewViewer.Desktop v${{ env.CI_ACTION_REF_NAME }}
                  draft: true
                  prerelease: false

    android:
        name: Build Android
        if: >-
            github.event_name == 'push'
            || github.event_name == 'pull_request'
            || (github.event_name == 'workflow_dispatch'
            && (inputs.platform == 'all' || inputs.platform == 'android'))
        runs-on: ubuntu-24.04
        timeout-minutes: 90
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  submodules: recursive
                  persist-credentials: false

            - name: Setup JDK 21
              uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
              with:
                  distribution: temurin
                  java-version: "21"

            - name: Setup mise
              uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
              with:
                  install: false
                  cache: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Install tools via mise
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              shell: bash
              run: |
                  mise install --yes
                  mise ls --current

            - name: Setup JDK 21
              uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
              with:
                  distribution: temurin
                  java-version: "21"

            - name: Restore workload
              shell: bash
              run: dotnet workload restore src/KyoshinEewViewer.Android/KyoshinEewViewer.Android.csproj

            - name: Install missing Android SDK components
              shell: bash
              run: |
                  dotnet build src/KyoshinEewViewer.Android/KyoshinEewViewer.Android.csproj \
                    -t:InstallAndroidDependencies \
                    -p:AndroidSdkDirectory="$ANDROID_HOME" \
                    -p:AcceptAndroidSDKLicenses=true

            - name: Build AAB / APK
              shell: bash
              env:
                  EQMONITOR_BASE_URL: ${{ secrets.EQMONITOR_BASE_URL }}
              run: dotnet publish src/KyoshinEewViewer.Android/KyoshinEewViewer.Android.csproj -c Release -o out/android

            - name: Upload AAB artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: android-aab
                  path: out/android/*.aab
                  if-no-files-found: error
                  retention-days: 7

            - name: Upload APK artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: android-apk
                  path: out/android/*.apk
                  if-no-files-found: error
                  retention-days: 7

    build-ios:
        name: Build iOS
        if: >-
            (github.event_name == 'push' && github.ref == 'refs/heads/develop')
            || (github.event_name == 'workflow_dispatch'
            && (inputs.platform == 'all' || inputs.platform == 'store' || inputs.platform == 'ios'))
        runs-on: macos-26
        timeout-minutes: 120
        environment: testflight-build
        permissions:
            contents: read
        outputs:
            app-version: ${{ steps.version.outputs.app-version }}
            build-number: ${{ steps.version.outputs.build-number }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  submodules: recursive
                  persist-credentials: false

            - name: Select Xcode
              uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
              with:
                  xcode-version: ${{ env.XCODE_VERSION }}

            - name: Setup mise
              uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
              with:
                  install: false
                  cache: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Install tools via mise
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              shell: bash
              run: |
                  mise install --yes
                  mise ls --current

            - name: Restore workload
              shell: bash
              run: dotnet workload restore src/KyoshinEewViewer.iOS/KyoshinEewViewer.iOS.csproj

            - name: Resolve build number
              id: version
              env:
                  ASC_APP_ID: ${{ vars.ASC_APP_ID || secrets.ASC_APP_ID }}
                  ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
                  ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
                  ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
                  APP_VERSION: ${{ inputs.app_version || '1.0' }}
                  INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
              shell: bash
              run: |
                  if [ -z "$ASC_APP_ID" ]; then
                    echo "::error::ASC_APP_ID が未設定です。net.yumnumm.KyoshinEewViewer のアプリレコードを App Store Connect で作成し、Variables (または Secrets) の ASC_APP_ID に App ID を設定してください。"
                    exit 1
                  fi
                  BUILD_NUMBER="$INPUT_BUILD_NUMBER"
                  if [ -z "$BUILD_NUMBER" ]; then
                    if ! NEXT_BUILD_JSON="$(asc builds next-build-number --app "$ASC_APP_ID" --version "$APP_VERSION" --platform IOS --output json)"; then
                      echo "::error::App Store Connect へ問い合わせできませんでした。ASC_KEY_ID / ASC_ISSUER_ID / ASC_PRIVATE_KEY_B64 を確認してください。"
                      exit 1
                    fi
                    BUILD_NUMBER="$(printf '%s' "$NEXT_BUILD_JSON" | sed -n 's/.*"nextBuildNumber":"\([0-9]*\)".*/\1/p')"
                  fi
                  if [ -z "$BUILD_NUMBER" ]; then
                    echo "::error::ビルド番号の取得に失敗しました。build_number を明示指定してください。"
                    exit 1
                  fi
                  echo "app-version=$APP_VERSION" >> "$GITHUB_OUTPUT"
                  echo "build-number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
                  echo "バージョン $APP_VERSION / ビルド $BUILD_NUMBER でビルドします"

            - name: Build ipa
              env:
                  APP_ID: ${{ vars.ASC_APP_ID || secrets.ASC_APP_ID }}
                  APP_VERSION: ${{ steps.version.outputs.app-version }}
                  BUILD_NUMBER: ${{ steps.version.outputs.build-number }}
                  ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
                  ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
                  ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
                  EQMONITOR_BASE_URL: ${{ secrets.EQMONITOR_BASE_URL }}
                  SKIP_UPLOAD: "true"
              shell: bash
              run: ./scripts/publish-testflight-ios.sh

            - name: Upload ipa artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: ios-ipa
                  path: out/testflight-ios/export/*.ipa
                  if-no-files-found: error
                  retention-days: 7

    deploy-ios:
        name: Deploy iOS
        needs: build-ios
        if: ${{ !inputs.skip_upload }}
        runs-on: macos-26
        timeout-minutes: 60
        environment: testflight
        permissions:
            contents: read
            pull-requests: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Setup mise
              uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
              with:
                  cache: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Download ipa artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: ios-ipa
                  path: ipa

            - name: Build changelog
              env:
                  ASC_APP_ID: ${{ vars.ASC_APP_ID || secrets.ASC_APP_ID }}
                  ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
                  ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
                  ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
                  OUTPUT_PATH: ${{ github.workspace }}/out/testflight-changelog.txt
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              shell: bash
              run: ./scripts/build-testflight-changelog.sh

            - name: Upload to App Store Connect
              env:
                  ASC_APP_ID: ${{ vars.ASC_APP_ID || secrets.ASC_APP_ID }}
                  ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
                  ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
                  ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
                  APP_VERSION: ${{ needs.build-ios.outputs.app-version }}
                  BUILD_NUMBER: ${{ needs.build-ios.outputs.build-number }}
                  TESTFLIGHT_GROUP: ${{ inputs.testflight_group || vars.TESTFLIGHT_EXTERNAL_GROUP || '2706fecb-47f0-47da-b802-08987ae78803' }}
                  CHANGELOG_PATH: ${{ github.workspace }}/out/testflight-changelog.txt
              shell: bash
              run: |
                  IPA_PATH=""
                  for candidate in ipa/*.ipa; do
                    [ -f "$candidate" ] || continue
                    IPA_PATH="$candidate"
                    break
                  done
                  if [ -z "$IPA_PATH" ]; then
                    echo "::error::ipa が見つかりません。"
                    exit 1
                  fi
                  if [ -z "$TESTFLIGHT_GROUP" ]; then
                    echo "::error::配布先のテスターグループが解決できませんでした。Variables の TESTFLIGHT_EXTERNAL_GROUP を確認してください。"
                    exit 1
                  fi
                  echo "バージョン $APP_VERSION($BUILD_NUMBER) をグループ $TESTFLIGHT_GROUP へ配信します"
                  asc publish testflight \
                    --app "$ASC_APP_ID" \
                    --ipa "$IPA_PATH" \
                    --group "$TESTFLIGHT_GROUP" \
                    --test-notes "$(cat "$CHANGELOG_PATH")" \
                    --locale "$TESTFLIGHT_LOCALE" \
                    --wait \
                    --submit \
                    --confirm \
                    --notify \
                    --timeout 30m

    build-macos:
        name: Build macOS
        if: >-
            (github.event_name == 'push' && github.ref == 'refs/heads/develop')
            || (github.event_name == 'workflow_dispatch'
            && (inputs.platform == 'all' || inputs.platform == 'store' || inputs.platform == 'macos'))
        runs-on: macos-26
        timeout-minutes: 90
        environment: testflight-build
        permissions:
            contents: read
        outputs:
            app-version: ${{ steps.version.outputs.app-version }}
            build-number: ${{ steps.version.outputs.build-number }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  submodules: recursive
                  persist-credentials: false

            - name: Select Xcode
              uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
              with:
                  xcode-version: ${{ env.XCODE_VERSION }}

            - name: Setup mise
              uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
              with:
                  install: false
                  cache: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Install tools via mise
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              shell: bash
              run: |
                  mise install --yes
                  mise ls --current

            - name: Resolve build number
              id: version
              env:
                  ASC_APP_ID: ${{ vars.ASC_APP_ID || secrets.ASC_APP_ID }}
                  ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
                  ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
                  ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
                  APP_VERSION: ${{ inputs.app_version || '1.0' }}
                  INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
              shell: bash
              run: |
                  if [ -z "$ASC_APP_ID" ]; then
                    echo "::error::ASC_APP_ID is not set. Please create the app record in App Store Connect and set the App ID in Variables (or Secrets) as ASC_APP_ID."
                    exit 1
                  fi
                  BUILD_NUMBER="$INPUT_BUILD_NUMBER"
                  if [ -z "$BUILD_NUMBER" ]; then
                    if ! NEXT_BUILD_JSON="$(asc builds next-build-number --app "$ASC_APP_ID" --version "$APP_VERSION" --platform MAC_OS --output json)"; then
                      echo "::error::Failed to contact App Store Connect. Please check ASC_KEY_ID / ASC_ISSUER_ID / ASC_PRIVATE_KEY_B64."
                      exit 1
                    fi
                    BUILD_NUMBER="$(printf '%s' "$NEXT_BUILD_JSON" | sed -n 's/.*"nextBuildNumber":"\([0-9]*\)".*/\1/p')"
                  fi
                  if [ -z "$BUILD_NUMBER" ]; then
                    echo "::error::Failed to get build number. Please specify build_number explicitly."
                    exit 1
                  fi
                  echo "app-version=$APP_VERSION" >> "$GITHUB_OUTPUT"
                  echo "build-number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

            - name: Import signing assets into a temporary keychain
              id: keychain
              env:
                  MAC_APP_DIST_P12_BASE64: ${{ secrets.MAC_APP_DIST_P12_BASE64 }}
                  MAC_INSTALLER_DIST_P12_BASE64: ${{ secrets.MAC_INSTALLER_DIST_P12_BASE64 }}
                  MAC_P12_PASSWORD: ${{ secrets.MAC_P12_PASSWORD }}
                  MAC_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAC_PROVISIONING_PROFILE_BASE64 }}
              shell: bash
              run: |
                  KEYCHAIN="$RUNNER_TEMP/kevi-signing.keychain-db"
                  KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
                  APP_P12="$RUNNER_TEMP/mac_app_dist.p12"
                  INSTALLER_P12="$RUNNER_TEMP/mac_installer_dist.p12"
                  PROFILE="$RUNNER_TEMP/KEVI_MacAppStore.provisionprofile"

                  (umask 077 && printf '%s' "$MAC_APP_DIST_P12_BASE64" | base64 --decode > "$APP_P12")
                  (umask 077 && printf '%s' "$MAC_INSTALLER_DIST_P12_BASE64" | base64 --decode > "$INSTALLER_P12")
                  (umask 077 && printf '%s' "$MAC_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE")

                  security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
                  security set-keychain-settings -lut 7200 "$KEYCHAIN"
                  security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
                  security import "$APP_P12" -k "$KEYCHAIN" -P "$MAC_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
                  security import "$INSTALLER_P12" -k "$KEYCHAIN" -P "$MAC_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
                  EXISTING_KEYCHAINS="$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')"
                  # 既存キーチェーン一覧をスペース区切りの複数引数として渡すため、意図的に非クォート
                  # shellcheck disable=SC2086
                  security list-keychains -d user -s $EXISTING_KEYCHAINS "$KEYCHAIN"
                  security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
                  rm -f "$APP_P12" "$INSTALLER_P12"

                  security find-identity -v "$KEYCHAIN"
                  echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"
                  echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"

            - name: Build pkg
              env:
                  APP_ID: ${{ vars.ASC_APP_ID || secrets.ASC_APP_ID }}
                  APP_VERSION: ${{ steps.version.outputs.app-version }}
                  BUILD_NUMBER: ${{ steps.version.outputs.build-number }}
                  SIGNING_KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
                  PROVISIONING_PROFILE: ${{ steps.keychain.outputs.profile }}
                  EQMONITOR_BASE_URL: ${{ secrets.EQMONITOR_BASE_URL }}
                  SKIP_UPLOAD: "true"
              shell: bash
              run: ./scripts/publish-testflight-macos.sh

            - name: Upload pkg artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: macos-pkg
                  path: out/testflight-macos/*.pkg
                  if-no-files-found: error
                  retention-days: 7

    deploy-macos:
        name: Deploy macOS
        needs: build-macos
        if: ${{ !inputs.skip_upload }}
        runs-on: macos-26
        timeout-minutes: 60
        environment: testflight
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup mise
              uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
              with:
                  cache: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Download pkg artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: macos-pkg
                  path: pkg

            - name: Upload to App Store Connect
              env:
                  ASC_APP_ID: ${{ vars.ASC_APP_ID || secrets.ASC_APP_ID }}
                  ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
                  ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
                  ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
                  APP_VERSION: ${{ needs.build-macos.outputs.app-version }}
                  BUILD_NUMBER: ${{ needs.build-macos.outputs.build-number }}
              shell: bash
              run: |
                  PKG_PATH=""
                  for candidate in pkg/*.pkg; do
                    [ -f "$candidate" ] || continue
                    PKG_PATH="$candidate"
                    break
                  done
                  if [ -z "$PKG_PATH" ]; then
                    echo "::error::pkg not found."
                    exit 1
                  fi
                  asc builds upload \
                    --app "$ASC_APP_ID" \
                    --pkg "$PKG_PATH" \
                    --version "$APP_VERSION" \
                    --build-number "$BUILD_NUMBER" \
                    --output json
                  asc builds wait \
                    --app "$ASC_APP_ID" \
                    --version "$APP_VERSION" \
                    --build-number "$BUILD_NUMBER" \
                    --platform MAC_OS \
                    --timeout 30m \
                    --fail-on-invalid
