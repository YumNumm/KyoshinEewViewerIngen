name: deploy-app

# Android / iOS / macOS のストア配信 (App Store Connect / TestFlight) をまとめたワークフロー。
#
# 既存の deploy.yaml とは役割が違うため別ファイルにしている。
#   - deploy.yaml     : コンテナイメージと ad-hoc 配布 (GitHub Releases)。無署名 + ad-hoc 署名
#   - deploy-app.yaml : ストア配信。正式な署名とビルド番号の管理が必要
#
# develop への push で iOS / macOS を自動でビルドしてアップロードする。
# TestFlight のベータグループへの配布は testflight_group を指定したときだけ行うため、
# push 由来のビルドは内部にアップロードされるだけで外部配信はされない。
# environment は 2 つ使う。
#   - testflight-build : ビルド用。Secrets の参照範囲を絞るためだけのもので承認は不要
#   - testflight       : アップロード用。外部への配信になるため必要に応じて承認者を設定する
#
# 必要な Secrets / Variables:
#   ASC_APP_ID                      Variables 推奨。ASC のアプリ ID (数値)。
#                                   net.yumnumm.KyoshinEewViewer のアプリレコードを作成してから設定する
#   ASC_KEY_ID                      ASC API キー ID
#   ASC_ISSUER_ID                   ASC の issuer ID (UUID)。asc auth issuer-id で取得
#   ASC_PRIVATE_KEY_B64             AuthKey_<KEY_ID>.p8 を base64 化したもの
#   MAC_APP_DIST_P12_BASE64         (macOS のみ) .app 署名証明書の .p12
#   MAC_INSTALLER_DIST_P12_BASE64   (macOS のみ) pkg 署名証明書の .p12
#   MAC_P12_PASSWORD                (macOS のみ) 上記 .p12 のパスワード
#   MAC_PROVISIONING_PROFILE_BASE64 (macOS のみ) Mac App Store 用プロビジョニングプロファイル
#
# iOS は Cloud-managed certificates を使うため証明書もキーチェーンも不要。
# macOS (Mac App Store) はクラウド署名に対応していないため .p12 が必要。

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      platform:
        description: "配信対象のプラットフォーム"
        type: choice
        options:
          - ios
          - macos
          - all
        default: ios
      app_version:
        description: "アプリのバージョン (CFBundleShortVersionString)"
        type: string
        default: "1.0"
      build_number:
        description: "ビルド番号 (CFBundleVersion)。空なら App Store Connect から次の番号を取得する"
        type: string
        default: ""
      testflight_group:
        description: "iOS の配布先 TestFlight テスターグループ名。空ならアップロードのみ行う"
        type: string
        default: ""
      skip_upload:
        description: "ビルドのみ行い App Store Connect へアップロードしない"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # ビルド番号を App Store Connect から取る以上、並走すると同じ番号を取り合うため直列化する
  group: deploy-app-${{ github.ref }}
  cancel-in-progress: false

env:
  # .NET SDK のバージョンは mise.toml / mise.lock 側で管理する
  XCODE_VERSION: "26.6"
  # asc CLI を非対話環境向けに設定する (docs/TESTFLIGHT_MACOS.md「遭遇したエラー 2」)
  # キーチェーン方式は GUI の許可ダイアログ待ちでハングし得るため CI では必ず環境変数認証にする
  # mise が asdf の dotnet プラグインを入れる際に同意を求めて失敗するため非対話で許可する
  MISE_YES: "1"
  ASC_BYPASS_KEYCHAIN: "1"
  # スピナーの制御文字でログが汚れるのを防ぐ
  ASC_SPINNER_DISABLED: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Android
  # ---------------------------------------------------------------------------
  # 現状ビルドできないため無効化している。有効化するには以下の 2 点が必要:
  #   1. src/KyoshinEewViewer.Android の Avalonia 12 対応。AndroidApp.cs が旧シグネチャの
  #      .UseReactiveUI() を呼んでおり、Avalonia 12 / ReactiveUI.Avalonia では引数付きの
  #      .UseReactiveUI(Action<...>) が必要なためコンパイルが通らない
  #      (iOS ヘッドは AppDelegate.cs で .UseReactiveUI(_ => { }) に修正済み)
  #   2. Google Play 用の署名鍵とサービスアカウントの整備 (未着手)
  # 枠だけ残しておく。platform の選択肢に android は無いため、この if は常に false になる
  # (actionlint が if: false を定数条件として弾くため、この形で無効化している)。
  # 上記が済んだら platform の options へ android を追加して steps を実装する。
  build-android:
    name: Android ビルド (無効)
    if: inputs.platform == 'android'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: 未実装
        shell: bash
        run: |
          echo "Android ヘッドは Avalonia 12 へ未追従のためビルドできません。" >&2
          exit 1

  # ---------------------------------------------------------------------------
  # iOS
  # ---------------------------------------------------------------------------
  build-ios:
    name: iOS ビルド
    if: github.event_name == 'push' || inputs.platform == 'ios' || inputs.platform == 'all'
    runs-on: macos-26
    timeout-minutes: 120
    # 承認ゲートは deploy 側に置く。ここで environment を指定しているのは
    # Secrets の参照範囲を environment に閉じるため (zizmor secrets-outside-env)
    environment: testflight-build
    permissions:
      contents: read
    outputs:
      app-version: ${{ steps.version.outputs.app-version }}
      build-number: ${{ steps.version.outputs.build-number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      # ランナー既定の Xcode に依存すると更新でビルドが揺れるため固定する
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      # .NET SDK も asc CLI も mise.toml / mise.lock で管理しているため mise だけで揃える。
      # setup-dotnet を併用すると mise の dotnet と PATH を取り合って
      # ワークロードの入った SDK と別の SDK を引きかねない。
      # asc は github: バックエンドから取得するため、GITHUB_TOKEN が無いと
      # GitHub API のレート制限に当たる (docs/TESTFLIGHT_MACOS.md 参照)
      # mise 本体だけ入れ、ツールの導入は次のステップで行う。
      # mise.lock が dotnet を asdf バックエンドで固定しており、プラグイン未導入の
      # 環境では同意を求めて失敗する。mise-action は --yes を渡さないため自分で渡す
      # (プラグイン名 dotnet は core プラグインと衝突するので明示的な導入はできない)
      - name: Setup mise (.NET SDK / asc CLI)
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tools via mise
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mise install --yes
          mise ls --current

      # ios ワークロードが無いと net10.0-ios をビルドできない。
      # mise の dotnet はユーザー領域に入るため sudo は不要
      - name: Restore workload
        shell: bash
        run: dotnet workload restore src/KyoshinEewViewer.iOS/KyoshinEewViewer.iOS.csproj

      # ビルド番号は github.run_number では駄目。ASC 側の履歴と無関係なので衝突し得る
      - name: ビルド番号を決定
        id: version
        env:
          ASC_APP_ID: ${{ vars.ASC_APP_ID || secrets.ASC_APP_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
          APP_VERSION: ${{ inputs.app_version || '1.0' }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        shell: bash
        run: |
          if [ -z "$ASC_APP_ID" ]; then
            echo "::error::ASC_APP_ID が未設定です。net.yumnumm.KyoshinEewViewer のアプリレコードを App Store Connect で作成し、Variables (または Secrets) の ASC_APP_ID に App ID を設定してください。"
            exit 1
          fi
          BUILD_NUMBER="$INPUT_BUILD_NUMBER"
          if [ -z "$BUILD_NUMBER" ]; then
            if ! NEXT_BUILD_JSON="$(asc builds next-build-number --app "$ASC_APP_ID" --version "$APP_VERSION" --platform IOS --output json)"; then
              echo "::error::App Store Connect へ問い合わせできませんでした。ASC_KEY_ID / ASC_ISSUER_ID / ASC_PRIVATE_KEY_B64 を確認してください。"
              exit 1
            fi
            BUILD_NUMBER="$(printf '%s' "$NEXT_BUILD_JSON" | sed -n 's/.*"nextBuildNumber":"\([0-9]*\)".*/\1/p')"
          fi
          if [ -z "$BUILD_NUMBER" ]; then
            echo "::error::ビルド番号の取得に失敗しました。build_number を明示指定してください。"
            exit 1
          fi
          echo "app-version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "build-number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "バージョン $APP_VERSION / ビルド $BUILD_NUMBER でビルドします"

      # 無署名の .app から .xcarchive を組み立て、xcodebuild -exportArchive で
      # クラウド署名して ipa にする。証明書 (.p12) やキーチェーンは使わない
      - name: ipa を作成
        env:
          APP_ID: ${{ vars.ASC_APP_ID || secrets.ASC_APP_ID }}
          APP_VERSION: ${{ steps.version.outputs.app-version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build-number }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
          # アップロードは deploy-ios ジョブが行う
          SKIP_UPLOAD: "true"
        shell: bash
        run: ./scripts/publish-testflight-ios.sh

      - name: ipa を artifact へアップロード
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-ipa
          path: out/testflight-ios/export/*.ipa
          if-no-files-found: error
          retention-days: 7

  deploy-ios:
    name: iOS TestFlight 配信
    needs: build-ios
    if: ${{ !inputs.skip_upload }}
    runs-on: macos-26
    timeout-minutes: 60
    # 外部への配信になるため承認ゲートを掛けられるようにする
    environment: testflight
    permissions:
      contents: read
    steps:
      # mise.toml を読ませるためにチェックアウトする (asc CLI の解決に必要)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ipa を artifact から取得
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ios-ipa
          path: ipa

      - name: App Store Connect へアップロード
        env:
          ASC_APP_ID: ${{ vars.ASC_APP_ID || secrets.ASC_APP_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
          APP_VERSION: ${{ needs.build-ios.outputs.app-version }}
          BUILD_NUMBER: ${{ needs.build-ios.outputs.build-number }}
          TESTFLIGHT_GROUP: ${{ inputs.testflight_group }}
        shell: bash
        run: |
          IPA_PATH=""
          for candidate in ipa/*.ipa; do
            [ -f "$candidate" ] || continue
            IPA_PATH="$candidate"
            break
          done
          if [ -z "$IPA_PATH" ]; then
            echo "::error::ipa が見つかりません。"
            exit 1
          fi
          if [ -n "$TESTFLIGHT_GROUP" ]; then
            # 外部テスターグループはベータ審査を通す必要があるため --submit / --confirm を付ける
            asc publish testflight \
              --app "$ASC_APP_ID" \
              --ipa "$IPA_PATH" \
              --group "$TESTFLIGHT_GROUP" \
              --wait \
              --submit \
              --confirm \
              --timeout 30m
            exit 0
          fi
          asc builds upload \
            --app "$ASC_APP_ID" \
            --ipa "$IPA_PATH" \
            --version "$APP_VERSION" \
            --build-number "$BUILD_NUMBER" \
            --output json
          # アップロード直後は ASC 側にビルドが現れるまで数分かかる
          asc builds wait \
            --app "$ASC_APP_ID" \
            --version "$APP_VERSION" \
            --build-number "$BUILD_NUMBER" \
            --platform IOS \
            --timeout 30m \
            --fail-on-invalid

  # ---------------------------------------------------------------------------
  # macOS
  # ---------------------------------------------------------------------------
  # Mac App Store 版はクラウド署名に対応していないため、Secrets の .p12 を
  # 一時キーチェーンへ取り込んで署名する。手順は docs/TESTFLIGHT_MACOS.md と同じで、
  # 実処理は既存の scripts/publish-testflight-macos.sh に任せる。
  build-macos:
    name: macOS ビルド
    if: github.event_name == 'push' || inputs.platform == 'macos' || inputs.platform == 'all'
    runs-on: macos-26
    timeout-minutes: 90
    # build-ios と同じ理由で environment を指定する (承認ゲートは deploy 側)
    environment: testflight-build
    permissions:
      contents: read
    outputs:
      app-version: ${{ steps.version.outputs.app-version }}
      build-number: ${{ steps.version.outputs.build-number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      # mise 本体だけ入れ、ツールの導入は次のステップで行う。
      # mise.lock が dotnet を asdf バックエンドで固定しており、プラグイン未導入の
      # 環境では同意を求めて失敗する。mise-action は --yes を渡さないため自分で渡す
      # (プラグイン名 dotnet は core プラグインと衝突するので明示的な導入はできない)
      - name: Setup mise (.NET SDK / asc CLI)
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tools via mise
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mise install --yes
          mise ls --current

      - name: ビルド番号を決定
        id: version
        env:
          ASC_APP_ID: ${{ vars.ASC_APP_ID || secrets.ASC_APP_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
          APP_VERSION: ${{ inputs.app_version || '1.0' }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        shell: bash
        run: |
          if [ -z "$ASC_APP_ID" ]; then
            echo "::error::ASC_APP_ID が未設定です。net.yumnumm.KyoshinEewViewer のアプリレコードを App Store Connect で作成し、Variables (または Secrets) の ASC_APP_ID に App ID を設定してください。"
            exit 1
          fi
          BUILD_NUMBER="$INPUT_BUILD_NUMBER"
          if [ -z "$BUILD_NUMBER" ]; then
            if ! NEXT_BUILD_JSON="$(asc builds next-build-number --app "$ASC_APP_ID" --version "$APP_VERSION" --platform MAC_OS --output json)"; then
              echo "::error::App Store Connect へ問い合わせできませんでした。ASC_KEY_ID / ASC_ISSUER_ID / ASC_PRIVATE_KEY_B64 を確認してください。"
              exit 1
            fi
            BUILD_NUMBER="$(printf '%s' "$NEXT_BUILD_JSON" | sed -n 's/.*"nextBuildNumber":"\([0-9]*\)".*/\1/p')"
          fi
          if [ -z "$BUILD_NUMBER" ]; then
            echo "::error::ビルド番号の取得に失敗しました。build_number を明示指定してください。"
            exit 1
          fi
          echo "app-version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "build-number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      # ログインキーチェーンを汚さないよう一時キーチェーンを作る。
      # set-key-partition-list を忘れると codesign がハングまたは errSecInternalComponent で失敗する
      - name: 署名資材を一時キーチェーンへ取り込む
        id: keychain
        env:
          MAC_APP_DIST_P12_BASE64: ${{ secrets.MAC_APP_DIST_P12_BASE64 }}
          MAC_INSTALLER_DIST_P12_BASE64: ${{ secrets.MAC_INSTALLER_DIST_P12_BASE64 }}
          MAC_P12_PASSWORD: ${{ secrets.MAC_P12_PASSWORD }}
          MAC_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAC_PROVISIONING_PROFILE_BASE64 }}
        shell: bash
        run: |
          KEYCHAIN="$RUNNER_TEMP/kevi-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          APP_P12="$RUNNER_TEMP/mac_app_dist.p12"
          INSTALLER_P12="$RUNNER_TEMP/mac_installer_dist.p12"
          PROFILE="$RUNNER_TEMP/KEVI_MacAppStore.provisionprofile"

          # 秘密情報はログへ出さない。他ユーザーから読めないよう umask を絞る
          (umask 077 && printf '%s' "$MAC_APP_DIST_P12_BASE64" | base64 --decode > "$APP_P12")
          (umask 077 && printf '%s' "$MAC_INSTALLER_DIST_P12_BASE64" | base64 --decode > "$INSTALLER_P12")
          (umask 077 && printf '%s' "$MAC_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE")

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # 既定は 5 分でロックされるため延ばす。ネスト署名だけで数分かかる
          security set-keychain-settings -lut 7200 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$APP_P12" -k "$KEYCHAIN" -P "$MAC_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security import "$INSTALLER_P12" -k "$KEYCHAIN" -P "$MAC_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          # 検索リストへ足さないと codesign が identity を見つけられない
          EXISTING_KEYCHAINS="$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')"
          # shellcheck disable=SC2086 # キーチェーン一覧は空白区切りの複数引数として渡す必要がある
          security list-keychains -d user -s $EXISTING_KEYCHAINS "$KEYCHAIN"
          # 非対話シェルから codesign / productbuild を使うには partition list の設定が必須
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          rm -f "$APP_P12" "$INSTALLER_P12"

          security find-identity -v "$KEYCHAIN"
          echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"

      - name: pkg を作成
        env:
          APP_ID: ${{ vars.ASC_APP_ID || secrets.ASC_APP_ID }}
          APP_VERSION: ${{ steps.version.outputs.app-version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build-number }}
          SIGNING_KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
          PROVISIONING_PROFILE: ${{ steps.keychain.outputs.profile }}
          # アップロードは deploy-macos ジョブが行う
          SKIP_UPLOAD: "true"
        shell: bash
        run: ./scripts/publish-testflight-macos.sh

      - name: pkg を artifact へアップロード
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-pkg
          path: out/testflight-macos/*.pkg
          if-no-files-found: error
          retention-days: 7

  deploy-macos:
    name: macOS TestFlight 配信
    needs: build-macos
    if: ${{ !inputs.skip_upload }}
    runs-on: macos-26
    timeout-minutes: 60
    environment: testflight
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: pkg を artifact から取得
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-pkg
          path: pkg

      - name: App Store Connect へアップロード
        env:
          ASC_APP_ID: ${{ vars.ASC_APP_ID || secrets.ASC_APP_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
          APP_VERSION: ${{ needs.build-macos.outputs.app-version }}
          BUILD_NUMBER: ${{ needs.build-macos.outputs.build-number }}
        shell: bash
        run: |
          PKG_PATH=""
          for candidate in pkg/*.pkg; do
            [ -f "$candidate" ] || continue
            PKG_PATH="$candidate"
            break
          done
          if [ -z "$PKG_PATH" ]; then
            echo "::error::pkg が見つかりません。"
            exit 1
          fi
          asc builds upload \
            --app "$ASC_APP_ID" \
            --pkg "$PKG_PATH" \
            --version "$APP_VERSION" \
            --build-number "$BUILD_NUMBER" \
            --output json
          asc builds wait \
            --app "$ASC_APP_ID" \
            --version "$APP_VERSION" \
            --build-number "$BUILD_NUMBER" \
