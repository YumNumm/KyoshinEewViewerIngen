name: tagpr

on:
  push:
    branches:
      - develop

jobs:
  tagpr:
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      # https://github.com/actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # https://github.com/Songmu/tagpr
      - uses: Songmu/tagpr@0c4eb5a3b0862693702acea436a7c68bd586530d # v1.21.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
